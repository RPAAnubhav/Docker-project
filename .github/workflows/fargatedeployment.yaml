name: Deploy to AWS ECS

on:
  push:
    branches:
      - DEV

jobs:
  build:
    name: Build Java Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package -DskipTests
             pwd
             ls -larth

  push-image:
    name: Configure AWS and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-ecr-repo
          IMAGE_TAG: latest
        run: |
          pwd
          ls -larth
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  update-task-definition:
    name: Update ECS Task Definition
    runs-on: ubuntu-latest
    needs: push-image

    steps:
      - name: Fill in the new image ID in the ECS task definition
        run: |
          ECR_REGISTRY=$(aws ecr describe-repositories --query "repositories[0].repositoryUri" --output text)
          IMAGE_TAG=latest
          sed -i "s|<IMAGE>|$ECR_REGISTRY/$IMAGE_TAG|g" task-definition.json
          echo "Updated task-definition.json"

  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest
    needs: update-task-definition

    steps:
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: task-definition.json
          service: my-ecs-service
          cluster: my-ecs-cluster
          wait-for-service-stability: true
