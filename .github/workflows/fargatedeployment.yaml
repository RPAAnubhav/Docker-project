name: Deploy Java App to AWS ECS

on:
  push:
    branches:
      - DEV  

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v1
        env:
            AWS_REGION: ${{ secrets.AWS_REGION }}

      # Step 5: Build and push Docker image to AWS ECR
      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REPOSITORY: my-java-app  # Change to your ECR repo name
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)  # to generate a unique tag
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $615299762140.dkr.ecr.$us-east-1.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $615299762140.dkr.ecr.$us-east-1.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$615299762140.dkr.ecr.$us-east-1.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to ECS
        env:
          AWS_REGION: us-east-1
          CLUSTER_NAME: my-ecs-cluster
          SERVICE_NAME: my-ecs-service
          TASK_FAMILY: my-ecs-task:3  
          TASK_DEFINITION_FILE: my-ecs-task-revision3.json
        run: |
        # Get latest task definition and replace image URI
          aws ecs describe-task-definition --task-definition $TASK_FAMILY --query taskDefinition > $TASK_DEFINITION_FILE
          sed -i "s|<IMAGE_URI>|$IMAGE_URI|g" $TASK_DEFINITION_FILE

        # Register new task definition
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://$TASK_DEFINITION_FILE --query 'taskDefinition.taskDefinitionArn' --output text)

        # Update ECS service with new task definition
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --task-definition $NEW_TASK_DEF_ARN

